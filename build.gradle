plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group = 'dev.vibe'
// The single source of the Vibe version. The Vibe Launcher reads this line, and
// generateBuildInfo exposes it to the code as dev.vibe.BuildInfo.VERSION.
version = '0.0.6'

base {
    archivesName = 'Vibe-1.8.9'
}

java {
    // Gradle and compilation run on JDK 21; bytecode stays compatible with the 1.8.9 runtime.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
    // Java 8 is the target on purpose; javac's deprecation notice for it is noise.
    options.compilerArgs += ['-Xlint:-options']
}

def buildInfoDirectory = layout.buildDirectory.dir('generated/sources/buildInfo/java/main')
def generateBuildInfo = tasks.register('generateBuildInfo') {
    description = 'Generates dev.vibe.BuildInfo from the project version.'
    def vibeVersion = project.version.toString()
    inputs.property('version', vibeVersion)
    outputs.dir(buildInfoDirectory)
    doLast {
        def source = buildInfoDirectory.get().file('dev/vibe/BuildInfo.java').asFile
        source.parentFile.mkdirs()
        source.setText("""package dev.vibe;

/** Generated by the generateBuildInfo Gradle task from build.gradle. */
public final class BuildInfo {

    public static final String VERSION = "${vibeVersion}";

    private BuildInfo() {
    }
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generateBuildInfo)

repositories {
    mavenCentral()
    maven { url = 'https://maven.wagyourtail.xyz/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Combat hook tests inspect the actual Forge bytecode without launching GL.
    testImplementation files(provider { sourceSets.main.compileClasspath })
    // Match Minecraft 1.8.9's Gson; Unimined adds game libraries only to main.
    testImplementation 'com.google.code.gson:gson:2.2.4'
    // Cookie login uses the isolated HTTP client already shipped by Minecraft 1.8.9.
    testImplementation 'org.apache.httpcomponents:httpclient:4.3.3'
    // Minecraft is often launched with a JRE image that does not contain
    // javac. Janino produces Java 8 compatible bytecode that remains safe for
    // Forge 1.8.9's legacy ASM transformer.
    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'org.sejda.imageio:webp-imageio:0.1.6'
    // JavaScript runtime for the NES emulator. Everything bundled must be Java 8
    // bytecode: Minecraft 1.8.9 runs on Java 8, and Forge's ASM 5 cannot even scan
    // newer class files (nashorn-core 15, for example, is Java 11 bytecode).
    implementation 'org.mozilla:rhino:1.7.15'
    implementation 'org.mozilla:rhino-engine:1.7.15'
    // 1.86.11 keeps the binding compatible with the Java 8 bytecode target
    // used by Forge 1.8.9 while still exposing the complete ImGui controls.
    implementation 'io.github.spair:imgui-java-binding:1.86.11'
    implementation 'io.github.spair:imgui-java-natives-windows:1.86.11'
    implementation 'io.github.spair:imgui-java-natives-linux:1.86.11'
    implementation 'io.github.spair:imgui-java-natives-macos:1.86.11'
    implementation 'javazoom:jlayer:1.0.1'
}

unimined.minecraft {
    version = minecraft_version

    mappings {
        // Source code uses MCP names; searge supplies the runtime remapping.
        searge()
        mcp('stable', '22-1.8.9')
    }

    minecraftForge {
        loader forge_version
        // The Forge 1.8.9 access transformer is compatible with the running
        // JDK 21; do not make Gradle search for an unavailable JDK 8.
        useToolchains = false
    }
    defaultRemapJar = true

    runs {
        config('client') {
            javaVersion = JavaVersion.VERSION_1_8
            // Development runs use class directories, so the JAR manifest
            // cannot register Vibe's core plugin for us.
            jvmArgs '-Dfml.coreMods.load=dev.vibe.core.MoveFixLoadingPlugin'
        }
    }
}

apply from: 'gradle/client-run.gradle'

// Libraries shaded into the mod JAR. The legal inventory (gradle/licenses.gradle) uses the
// same selection, and the order decides which duplicate classes win.
def bundledLibraries = providers.provider {
    def runtimeLibraries = configurations.runtimeClasspath.files
    def named = { Closure<Boolean> matches -> runtimeLibraries.findAll { matches(it.name.toLowerCase(Locale.ROOT)) } }
    named { it.startsWith('webp-imageio') } +
        named { it.contains('imgui') } +
        named { it.startsWith('rhino') || it.contains('janino') || it.contains('commons-compiler') || it.contains('jlayer') }
}
ext.vibeBundledLibraries = bundledLibraries

apply from: 'gradle/licenses.gradle'

processResources {
    dependsOn tasks.named('verifyLicenseDocuments')
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // One copy of the legal documents, available in both development and the JAR.
    from('LICENSES') { into 'META-INF/vibe/LICENSES' }
    from(tasks.named('collectDependencyNotices')) { into 'META-INF/vibe/dependencies' }
    filesMatching('mcmod.info') {
        expand version: project.version
    }
    // Bundled assets are copied automatically from src/main/resources. These manifests
    // list the presets that are extracted and selected at runtime.
    def assets = file('src/main/resources/assets/vibe')
    def presetManifests = [
        shader    : ['**/*.frag'],
        waifu     : ['**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.webp'],
        girlfriend: ['**/*.mp3'],
    ]
    doLast {
        presetManifests.each { folder, patterns ->
            def root = new File(assets, folder)
            def entries = fileTree(root) { include patterns }.files.collect {
                root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            }
            // Shaders and waifus are listed by file name, girlfriend sounds by event folder path.
            if (folder != 'girlfriend') entries = entries.collect { it.substring(it.lastIndexOf('/') + 1) }
            def manifest = file("${destinationDir}/assets/vibe/${folder}/presets.txt")
            manifest.parentFile.mkdirs()
            manifest.setText(entries.sort().join('\n') + '\n', 'UTF-8')
        }
    }
}

jar {
    // Shade the bundled libraries (including WebP's and ImGui's native/ folders) so
    // every feature works in a normal Forge installation, not only in development.
    from { bundledLibraries.get().collect { zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The embedded dependencies are signed upstream. Their signature files refer to the
    // original standalone manifests and become invalid after shading, which makes Forge
    // reject the mod before it can load. Vibe supplies its own manifest below.
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC'
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
            'Implementation-Title': 'Vibe',
            'Implementation-Version': project.version,
            'Built-JDK': JavaVersion.current().toString(),
            'FMLCorePlugin': 'dev.vibe.core.MoveFixLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

// Matching source for the GPLv3/AGPLv3 combination, including uncommitted local changes.
tasks.register('sourceDistribution', Zip) {
    group = 'distribution'
    description = 'Packages the corresponding source next to the mod JAR.'
    dependsOn tasks.named('verifyLicenseDocuments')
    archiveFileName = "${base.archivesName.get()}-${project.version}-sources.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    includeEmptyDirs = false
    from(tasks.named('collectDependencyNotices')) { into 'LICENSES/dependencies' }
    from(project.projectDir) {
        include 'src/**', 'tools/**', 'docs/**', 'gradle/**', 'LICENSES/**', '.github/**'
        include '*.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat', '*.bat', '*.md'
        include '.gitignore', '.gitattributes', '.editorconfig'
        exclude '**/__pycache__/**', '**/*.pyc', '.gradle/**', '.git/**', 'run/**', 'build/**', 'logs/**'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('build') { dependsOn tasks.named('sourceDistribution') }

apply from: 'gradle/optifine.gradle'
apply from: 'gradle/verification.gradle'
