// Opt-in checks that are not part of `build`. The render checks draw real frames in an
// offscreen OpenGL context: no Minecraft window is opened and no user profile is touched.
// Screenshots and timings are written below build/<output directory>/.

def lwjglPlatform = {
    def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    osName.contains('win') ? 'windows' : osName.contains('mac') ? 'osx' : 'linux'
}

/**
 * Registers a JavaExec task that runs a test-source main class on Java 8 with LWJGL natives.
 * outputDirectory: folder below build/ for natives and results.
 * passOutput: whether the main class receives that folder as its first argument.
 */
def registerRenderCheck = { String name, String mainClassName, String outputDirectory, String purpose,
                            boolean passOutput = false, Closure extra = null ->
    tasks.register(name, JavaExec) {
        group = 'verification'
        description = purpose
        dependsOn tasks.named('testClasses')
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
        mainClass = mainClassName
        workingDir project.projectDir
        systemProperty 'log4j.configurationFile', project.file('src/test/resources/log4j2-test.xml').absolutePath
        def output = layout.buildDirectory.dir(outputDirectory)
        doFirst {
            def platform = lwjglPlatform()
            def natives = sourceSets.main.runtimeClasspath.files.find {
                it.name.startsWith('lwjgl-platform-') && it.name.endsWith('-natives-' + platform + '.jar')
            }
            if (natives == null) throw new GradleException('LWJGL native library archive not found for ' + platform)
            def nativeDirectory = new File(output.get().asFile, 'natives')
            project.copy {
                from project.zipTree(natives)
                include '*.dll', '*.so', '*.dylib', '*.jnilib'
                into nativeDirectory
            }
            systemProperty 'org.lwjgl.librarypath', nativeDirectory.absolutePath
            if (passOutput) setArgs([output.get().asFile.absolutePath] + (args ?: []))
        }
        if (extra != null) {
            extra.delegate = delegate
            extra.resolveStrategy = Closure.DELEGATE_FIRST
            extra.call()
        }
    }
}

