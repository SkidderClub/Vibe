<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <title>Vibe Breeze interface icons</title>
  <desc>Authored 24-unit interface symbols with consistent rounded strokes.</desc>
  <defs>
    <mask id="discord-eyes"><rect width="24" height="24" fill="white"/><ellipse cx="8.2" cy="12.8" rx="1.5" ry="1.9" fill="black"/><ellipse cx="15.8" cy="12.8" rx="1.5" ry="1.9" fill="black"/></mask>
    <mask id="profile-face"><rect width="24" height="24" fill="white"/><circle cx="12" cy="9" r="4" fill="black"/><path d="M5 20 C3 12 21 12 19 20 C15 23 9 23 5 20 Z" fill="black"/></mask>
    <symbol id="modules"><path d="M3 5 L8 5 M13 5 L21 5 M3 12 L14 12 M19 12 L21 12 M3 19 L5 19 M10 19 L21 19"/><path d="M9 2 L9 8 M15 9 L15 15 M6 16 L6 22"/></symbol>
    <symbol id="configs"><path d="M8 4 L13 4 L16 7 L22 7 L22 19 L8 19 Z"/><path d="M3 8 L3 22 L18 22 M12 10 L18 10 M12 14 L18 14"/></symbol>
