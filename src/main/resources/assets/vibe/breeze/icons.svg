    <symbol id="dots"><circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="star"><polygon points="12,2 15,8.5 22,9.5 17,14.5 18.2,22 12,18.5 5.8,22 7,14.5 2,9.5 9,8.5"/></symbol>
