    <symbol id="forest" viewBox="0 0 24 24"><polyline points="8,2 2,10 5,10 1,16 15,16 11,10 14,10 8,2"/><line x1="8" y1="16" x2="8" y2="22"/><polyline points="17,5 13,11 16,11 13,17 23,17 20,11 22,11 17,5"/><line x1="18" y1="17" x2="18" y2="22"/></symbol>
    <symbol id="shield" viewBox="0 0 24 24"><polygon points="12,2 21,6 20,14 17,19 12,23 7,19 4,14 3,6"/><polyline points="8,12 11,15 17,9"/></symbol>
