    <symbol id="manual" viewBox="0 0 24 24"><polyline points="12,21 8,19 2,19 2,3 8,3 12,5 16,3 22,3 22,19 16,19 12,21 12,5"/><line x1="5" y1="8" x2="9" y2="9"/><line x1="15" y1="9" x2="19" y2="8"/><line x1="5" y1="12" x2="9" y2="13"/><line x1="15" y1="13" x2="19" y2="12"/></symbol>
