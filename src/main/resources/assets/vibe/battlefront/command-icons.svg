  <use xlink:href="#forest" x="0" y="32" width="24" height="24"/><use xlink:href="#shield" x="48" y="32" width="24" height="24"/><use xlink:href="#tactics" x="96" y="32" width="24" height="24"/><use xlink:href="#appearance" x="144" y="32" width="24" height="24"/><use xlink:href="#weapon" x="192" y="32" width="24" height="24"/><use xlink:href="#helmet" x="240" y="32" width="24" height="24"/>
  <use xlink:href="#upgrade" x="0" y="64" width="24" height="24"/><use xlink:href="#deploy" x="48" y="64" width="24" height="24"/><use xlink:href="#credits" x="96" y="64" width="24" height="24"/><use xlink:href="#arrow" x="144" y="64" width="24" height="24"/><use xlink:href="#exit" x="192" y="64" width="24" height="24"/><use xlink:href="#check" x="240" y="64" width="24" height="24"/>
