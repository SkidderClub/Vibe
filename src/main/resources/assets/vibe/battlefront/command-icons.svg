<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 288 120" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
  <title>Battlefront 3 command deck icons</title>
  <desc>Original 24-unit vector symbols, rasterized once per session by the native client.</desc>
  <defs>
    <symbol id="operations" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="1" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="23"/><line x1="1" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="23" y2="12"/></symbol>
    <symbol id="army" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><circle cx="4" cy="9" r="2"/><circle cx="20" cy="9" r="2"/><polyline points="6,21 6,17 9,13 15,13 18,17 18,21"/><polyline points="1,20 1,16 4,13 6,14"/><polyline points="23,20 23,16 20,13 18,14"/><line x1="10" y1="20" x2="14" y2="20"/></symbol>
    <symbol id="arsenal" viewBox="0 0 24 24"><polyline points="4,3 15,14 12,17 1,6 1,2 4,3"/><line x1="10" y1="18" x2="17" y2="11"/><line x1="14" y1="16" x2="20" y2="22"/><line x1="18" y1="22" x2="22" y2="18"/><polyline points="20,3 16,7 18,9 23,4 23,1 20,3"/><line x1="4" y1="16" x2="9" y2="21"/><line x1="2" y1="22" x2="7" y2="17"/></symbol>
